<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SlothOS — Slow, Steady & Local AI Dev Agent</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans p-6">
  <div class="max-w-5xl mx-auto space-y-6">
    <!-- Header -->
    <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-lg">
      <div class="flex items-center gap-4">
        <span class="text-5xl">🦥</span>
        <div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">
            SlothOS: Local Autonomous Dev Agent
          </h1>
          <p class="text-slate-400 text-sm">100% Offline • Zero Cloud Tokens • Powered by Ollama Open Weights</p>
        </div>
      </div>
      <div id="healthBadge" class="px-3 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800 rounded-full text-xs font-mono">
        ● CHECKING LOCALHOST...
      </div>
    </header>

    <!-- Target Repo Input & Controls -->
    <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl flex flex-wrap gap-4 items-end">
      <div class="flex-1 min-w-[260px]">
        <label class="block text-xs text-slate-400 mb-1 font-mono">LOCAL GIT REPOSITORY PATH (LEAVE BLANK FOR CURRENT FOLDER)</label>
        <input id="repoPath" type="text" placeholder="Leave blank to use current sloth-os folder" 
          class="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:border-emerald-400 outline-none" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1 font-mono">OPEN-WEIGHT MODEL (HOT-SWAP)</label>
        <select id="modelSelect" class="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none">
          <option value="qwen2.5-coder:7b">qwen2.5-coder:7b</option>
          <option value="llama3.2:latest">llama3.2:latest</option>
        </select>
      </div>
      <button onclick="runSlothShip()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl transition">
        🌙 SlothShip (Auto-Commit & PR)
      </button>
      <button onclick="runSlothStandup()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-bold px-5 py-2.5 rounded-xl transition">
        ☕ 9 AM Standup Prep
      </button>
    </div>

    <!-- Status / Error Box -->
    <div id="statusBox" class="hidden bg-slate-900 border border-emerald-500/40 p-4 rounded-xl text-emerald-300 font-mono text-sm"></div>

    <!-- Output Area -->
    <div id="outputArea" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
  </div>

  <script>
    const API = 'http://localhost:4000/api';
    let latestAtomicCommits = [];
    let timerInterval;

    // Auto-detect installed Ollama models & default directory on startup
    window.addEventListener('DOMContentLoaded', async () => {
      const badge = document.getElementById('healthBadge');
      try {
        const res = await fetch(`${API}/health`);
        const data = await res.json();
        if (data.cwd) {
          document.getElementById('repoPath').placeholder = `Default: ${data.cwd}`;
        }
        if (data.models && data.models.length > 0) {
          const select = document.getElementById('modelSelect');
          select.innerHTML = data.models.map(m => `<option value="${m}">${m}</option>`).join('');
          badge.textContent = `● AIR-GAPPED LOCALHOST (${data.models.length} MODELS READY)`;
        } else {
          badge.textContent = '⚠️ OLLAMA NEEDS A MODEL';
          badge.className = 'px-3 py-1 bg-amber-950 text-amber-400 border border-amber-800 rounded-full text-xs font-mono';
        }
      } catch (e) {
        badge.textContent = '❌ BACKEND OFFLINE (RUN node server.js)';
        badge.className = 'px-3 py-1 bg-rose-950 text-rose-400 border border-rose-800 rounded-full text-xs font-mono';
      }
    });

    function setLoading(isLoading, text) {
      const box = document.getElementById('statusBox');
      clearInterval(timerInterval);
      if (isLoading) {
        let s = 0;
        box.className = 'bg-slate-900 border border-emerald-500/40 p-4 rounded-xl text-emerald-300 font-mono text-sm animate-pulse';
        box.textContent = `${text} (0s elapsed...)`;
        timerInterval = setInterval(() => {
          s++;
          box.textContent = `${text} (${s}s elapsed — running local inference on Mac...)`;
        }, 1000);
      } else {
        box.className = 'hidden';
      }
    }

    function showError(msg) {
      clearInterval(timerInterval);
      const box = document.getElementById('statusBox');
      box.className = 'bg-rose-950/60 border border-rose-500 p-4 rounded-xl text-rose-200 font-mono text-sm';
      box.innerHTML = `⚠️ <b>Action Needed:</b> ${msg}`;
    }

    async function runSlothShip() {
      try {
        const repoPath = document.getElementById('repoPath').value;
        const model = document.getElementById('modelSelect').value;
        setLoading(true, `🦥 Analyzing git diff locally with ${model}`);

        const res = await fetch(`${API}/sloth-ship`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath, model })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Server error');
        setLoading(false);

        if (data.status === 'clean') {
          document.getElementById('outputArea').innerHTML = `
            <div class="col-span-2 bg-slate-900 border border-slate-800 p-8 rounded-2xl text-center">
              <p class="text-lg text-emerald-300">${data.message}</p>
            </div>`;
          return;
        }

        const plan = data.plan || {};
        latestAtomicCommits = plan.atomicCommits || [];
        const commitsHtml = latestAtomicCommits.map(c => `
          <div class="bg-slate-950 border border-slate-800 p-3.5 rounded-xl space-y-1">
            <div class="font-mono text-emerald-400 text-sm font-semibold">${c.commitMessage}</div>
            <div class="text-xs text-slate-400">Files: ${(c.files || []).join(', ')}</div>
            <div class="text-xs text-slate-500 italic">${c.reasoning || ''}</div>
          </div>
        `).join('');

        document.getElementById('outputArea').innerHTML = `
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="font-bold text-lg">📦 Proposed Atomic Commits</h2>
              <span class="text-xs bg-emerald-950 text-emerald-300 px-2.5 py-1 rounded-lg">${plan.lazinessScore || '25 mins saved'}</span>
            </div>
            <div class="text-xs text-amber-400 font-mono">🛡️ Privacy Guard: ${plan.secretWarning || 'Secrets Redacted'}</div>
            <div class="space-y-3">${commitsHtml}</div>
            <button onclick="executeCommits()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-2.5 rounded-xl">
              ✅ 1-Click Stage & Commit All Groups
            </button>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
            <h2 class="font-bold text-lg">📝 Auto-Generated PR Description</h2>
            <div class="font-semibold text-emerald-300">${plan.prTitle || 'Pull Request Summary'}</div>
            <pre class="bg-slate-950 border border-slate-800 p-4 rounded-xl text-xs text-slate-300 whitespace-pre-wrap">${plan.prSummaryMarkdown || ''}</pre>
          </div>
        `;
      } catch (err) {
        showError(err.message);
      }
    }

    async function executeCommits() {
      try {
        const repoPath = document.getElementById('repoPath').value;
        const res = await fetch(`${API}/execute-commits`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath, atomicCommits: latestAtomicCommits })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error);
        alert('🦥 Executed ' + data.executed.length + ' clean commits locally!');
      } catch (err) {
        showError(err.message);
      }
    }

    async function runSlothStandup() {
      try {
        const repoPath = document.getElementById('repoPath').value;
        const model = document.getElementById('modelSelect').value;
        setLoading(true, `☕ Digesting local Git history with ${model}`);

        const res = await fetch(`${API}/sloth-standup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repoPath, model })
        });
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || 'Server error');
        setLoading(false);

        const scriptText = (data.spokenScript || 'Yesterday I shipped the core module, today I am testing it with zero blockers.').replace(/'/g, "\\'");

        document.getElementById('outputArea').innerHTML = `
          <div class="col-span-2 bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="font-bold text-xl">☕ Your 9:00 AM Standup Cheat Sheet</h2>
              <button onclick="speakStandup('${scriptText}')" 
                class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-xl text-xs font-bold">
                🔊 Read Out Loud While I Make Coffee
              </button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h3 class="text-emerald-400 font-bold text-sm mb-2">Yesterday</h3>
                <ul class="text-xs space-y-1.5 text-slate-300 list-disc pl-4">${(data.yesterday || []).map(i => `<li>${i}</li>`).join('')}</ul>
              </div>
              <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h3 class="text-amber-400 font-bold text-sm mb-2">Today</h3>
                <ul class="text-xs space-y-1.5 text-slate-300 list-disc pl-4">${(data.today || []).map(i => `<li>${i}</li>`).join('')}</ul>
              </div>
              <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                <h3 class="text-rose-400 font-bold text-sm mb-2">Blockers</h3>
                <p class="text-xs text-slate-300">${data.blockers || 'None!'}</p>
              </div>
            </div>
            <div class="bg-indigo-950/40 border border-indigo-800/50 p-4 rounded-xl">
              <div class="text-xs text-indigo-300 font-mono mb-1">🎙️ VERBATIM ZOOM SCRIPT:</div>
              <p class="text-sm italic text-slate-200">"${data.spokenScript || ''}"</p>
            </div>
          </div>
        `;
      } catch (err) {
        showError(err.message);
      }
    }

    function speakStandup(text) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }
  </script>
</body>
</html>
